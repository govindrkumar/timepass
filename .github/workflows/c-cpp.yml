name: C/C++ CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: g++ -std=c++17 main.cpp -o main

      - name: Upload Linux executable
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: gs-shell-linux
          path: main

      - name: Upload macOS executable
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: gs-shell-macos
          path: main

      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: gs-shell-windows
          path: main.exe
